   The world at 440x220 makes anything smaller than a large country hard to
   read, which matters now that the map is the puzzle. The viewBox is the
   single source of truth for the view, so screen->world conversion (used by
   the bonus pin) stays correct at any zoom. */
let mapView = { x:0, y:0, w:MAP_W, h:MAP_H };
// Must match tools/build_land.py: the geometry is simplified to half a pixel
// at this zoom, so zooming past it shows the simplification rather than the
// coast. 10m Natural Earth supports forty.
const MAX_ZOOM = 40;

/* Keep the view inside the world and never wider than it. Separate from
   applyView because a gesture needs the clamped numbers to work out where the
   finger now points, several times, before anything is drawn. */
function clampView(){
  mapView.w = Math.min(MAP_W, Math.max(MAP_W / MAX_ZOOM, mapView.w));
  mapView.h = mapView.w * (MAP_H / MAP_W);
  mapView.x = Math.min(MAP_W - mapView.w, Math.max(0, mapView.x));
  mapView.y = Math.min(MAP_H - mapView.h, Math.max(0, mapView.y));
}

function applyView(){
  clampView();
  document.getElementById('mapSvg')
    .setAttribute('viewBox', `${mapView.x} ${mapView.y} ${mapView.w} ${mapView.h}`);
  scalePins();
}

/* A drag delivers several pointermove events per displayed frame, and each one
   used to redraw the map. One redraw per frame is all the screen can show. */
let viewPending = false;
function scheduleView(){
  if(viewPending) return;
  viewPending = true;
  requestAnimationFrame(()=>{ viewPending = false; applyView(); });
}

/* Pin radii are in world units, so counter-scale them to hold a constant
   on-screen size as the view zooms. Strokes handle themselves via
   vector-effect. Called on every view change *and* whenever a pin is added,
   because pins are added after buildMap has already applied the view. */
let pinScale = null;
function scalePins(force){
  const k = mapView.w / MAP_W;
  // Panning does not change the scale, so there is nothing to counter.
  if(!force && k === pinScale) return;
  pinScale = k;
  document.querySelectorAll('#pinLayer circle').forEach(c=>{
    c.setAttribute('r', c.dataset.r * k);
  });
}

/* Screen point -> world coordinate, honouring the current zoom. */
function screenToWorld(clientX, clientY){
  const svg = document.getElementById('mapSvg');
  const rect = svg.getBoundingClientRect();
  return {
    x: mapView.x + ((clientX - rect.left) / rect.width) * mapView.w,
    y: mapView.y + ((clientY - rect.top) / rect.height) * mapView.h
  };
}

function zoomBy(factor, centreX, centreY){
  const cx = centreX === undefined ? mapView.x + mapView.w/2 : centreX;
  const cy = centreY === undefined ? mapView.y + mapView.h/2 : centreY;
  const newW = mapView.w / factor;
  // Keep the point under the cursor fixed while the view scales around it.
  mapView.x = cx - (cx - mapView.x) * (newW / mapView.w);
  mapView.y = cy - (cy - mapView.y) * (newW / mapView.w);
  mapView.w = newW;
  applyView();
}

function addPin(lat,lng,bucket,big){
  const p = project(lat,lng);
  const layer = document.getElementById('pinLayer');
  const r = big ? 7 : 5;
  const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
  circle.setAttribute('cx',p.x); circle.setAttribute('cy',p.y); circle.setAttribute('r',r);
  circle.dataset.r = r; circle.dataset.sw = 1.5;
  circle.setAttribute('fill', heatColorVar[bucket]); circle.setAttribute('stroke','var(--navy)');
  circle.setAttribute('stroke-width','1.5');
  circle.setAttribute('vector-effect','non-scaling-stroke');
  layer.appendChild(circle);
  scalePins(true);   // this one has never been scaled
}
function addTargetPin(lat,lng){
  const p = project(lat,lng);
  const layer = document.getElementById('pinLayer');
  const star = document.createElementNS('http://www.w3.org/2000/svg','circle');
  star.setAttribute('cx',p.x); star.setAttribute('cy',p.y); star.setAttribute('r',6);
  star.dataset.r = 6; star.dataset.sw = 2;
  star.setAttribute('fill','none'); star.setAttribute('stroke','var(--gold)');
  star.setAttribute('stroke-width','2');
  star.setAttribute('vector-effect','non-scaling-stroke');
  layer.appendChild(star);
  scalePins(true);
}

/* ---------- Rendering ---------- */
function currentTarget(){ return targets[state.round]; }
function targetCountry(){
  const tg = currentTarget();
  if(!tg) return null;
  // Match the country record by name: the dataset keys by QID, the demo set
  // has no QIDs, and the name is what both agree on.
  return COUNTRIES.find(c => c.names.en === tg.country.en) || null;
}

/* Every country that counts as right. Usually one; for a tradition inscribed
   by a dozen states, a dozen -- marking eleven of them wrong would be a bug,
   not a hard round. */
function targetCountries(){
  const tg = currentTarget();
  if(!tg) return [];
  const names = (tg.countryNames && tg.countryNames.length)
              ? tg.countryNames.map(n => n.en)
              : [tg.country.en];
  const found = COUNTRIES.filter(c => names.includes(c.names.en));
  return found.length ? found : [targetCountry()].filter(Boolean);
}

/* Where the answer is, for distance. A single-country entry is measured to the
   site itself. A multinational one has no single place -- its stored
   coordinate is just the first country's centroid -- so it is measured to
   whichever of its countries the guess is closest to. */
function answerDistanceKm(country){
  const tg = currentTarget();
  const answers = targetCountries();
  if(answers.length <= 1) return haversineKm(country.lat, country.lng, tg.lat, tg.lng);
  return Math.min(...answers.map(a => haversineKm(country.lat, country.lng, a.lat, a.lng)));
}
function currentGuesses(){ return state.guesses[state.round]; }
function roundFinished(){ return state.roundStatus[state.round] !== null; }

function render(){
  const T = t();
  document.getElementById('pitch').textContent = T.pitch;
  renderLinks();
  document.getElementById('tagline').textContent = T.tagline;
  renderTapHint();

  // rounds row
  const rr = document.getElementById('roundsRow'); rr.innerHTML = '';
  for(let i=0;i<N_ROUNDS;i++){
    const pip = document.createElement('div');
    let cls = 'round-pip';
    if(roundPlan(i).bonus) cls += ' bonus';
    if(state.roundStatus[i] === 'solved') cls += ' done-solved';
    else if(state.roundStatus[i] === 'failed') cls += ' done-failed';
    else if(i === state.round) cls += ' current';
    pip.className = cls;
    // The bonus round is marked rather than numbered: it is not a fourth site.
    pip.textContent = roundPlan(i).bonus ? '\u2605' : i+1;
    rr.appendChild(pip);
  }

  if(state.round >= N_ROUNDS){ renderFinal(); return; }

  const target = currentTarget();
  document.querySelector('.meta-row').style.display = '';   // renderFinal hides it
  document.getElementById('modeBadge').textContent = target.type==='material' ? T.modeMaterial : T.modeImmaterial;
  document.getElementById('scoreBadge').textContent = `\u03a3 ${T.scoreOf(totalScore(), MAX_SCORE)}`;
  const counter = document.getElementById('guessCounter');
  counter.textContent = T.guessCount(currentGuesses().length, guessesAllowed(state.round));
  if(guessesAllowed(state.round) > 1 && !roundFinished()){
    const note = document.createElement('div');
    note.className = 'counter-note';
    note.textContent = T.lastCounts;
    counter.appendChild(note);
  }

  // photo
  const img = document.getElementById('siteImg'), fb = document.getElementById('photoFallback');
  img.style.display = ''; fb.style.display = 'none';
  const box = document.getElementById('photoBox');
  box.classList.remove('zoomable');
  // Handlers must be attached before src: a cached image fires load immediately
  // on assignment, and a handler set afterwards would never run.
  img.onload = ()=> box.classList.add('zoomable');
  img.onerror = ()=>{
    img.style.display='none'; fb.style.display='flex';
    box.classList.remove('zoomable');
    document.getElementById('fallbackText').textContent = T.photoFallback;
  };
  // A downloaded copy wins when the pipeline made one; otherwise the photo
  // comes straight from Commons' CDN at full width. Either way a miss falls
  // through to onerror and the placeholder.
  const shot = currentPhoto(target);
  img.src = (shot && (shot.path || shot.url))
            || `images/${target.id}.jpg`;
  img.alt = roundFinished() ? target.names[lang] : '';
  // Re-render with the same src doesn't refire load; catch the already-decoded case.
  if(img.complete && img.naturalWidth) box.classList.add('zoomable');
  // Held back until the round is over. A photographer's name or a licence
  // template routinely carries a country in it, which hands the player the
  // answer from the corner of the picture.
  document.getElementById('photoCredit').textContent =
    (shot && roundFinished()) ? [shot.credit, shot.license].filter(Boolean).join(' · ') : '';
  renderPhotoCount(target);

  renderClues(target); renderHistory(); renderMapForRound(); renderRoundResult();
  document.getElementById('finalResult').hidden = true;
}

/* ---------- Photographs ----------
   One photo was a coin toss. Plenty of inscriptions have a single image on
   Wikidata that says almost nothing about the place -- a plaque, a doorway, a
   museum case -- and a round built on one of those is unguessable rather than
   hard. Each wrong guess reveals another, so a weak opening photo costs a
   guess instead of the round. */
function photosOf(target){
  return (target && target.photos && target.photos.length) ? target.photos
       : (target && target.image ? [target.image] : []);
}
/* How many photographs the player has earned: one to start, one more per
   guess made, capped at what the entry has. */
function unlockedCount(target){
  const n = photosOf(target).length;
  return n ? Math.min(currentGuesses().length + 1, n) : 0;
}

/* Which of them is on screen. Defaults to the newest, because the point of
   unlocking one is to see it, but the player can page back through the ones
   they have already earned -- an earlier shot is often the more useful clue,
   and having it vanish behind the next guess was a waste of it. */
let photoView = [0, 0, 0, 0];
function photoIndexFor(target){
  const unlocked = unlockedCount(target);
  if(!unlocked) return 0;
  return Math.min(photoView[state.round] || 0, unlocked - 1);
}
function currentPhoto(target){
  const ps = photosOf(target);
  return ps.length ? ps[photoIndexFor(target)] : null;
}
function showNewestPhoto(){
  const tg = currentTarget();
  photoView[state.round] = Math.max(0, unlockedCount(tg) - 1);
}
function stepPhoto(by){
  const tg = currentTarget();
  const unlocked = unlockedCount(tg);
  photoView[state.round] =
    Math.max(0, Math.min(photoIndexFor(tg) + by, unlocked - 1));
  render();
}

function renderPhotoCount(target){
  const nav = document.getElementById('photoNav');
  const el = document.getElementById('photoCount');
  if(!nav || !el) return;
  const unlocked = unlockedCount(target);
  if(unlocked < 2){ nav.hidden = true; return; }
  nav.hidden = false;
  const i = photoIndexFor(target);
  el.textContent = t().photoOf(i + 1, unlocked);
  // Gold only while looking at the one the last guess just earned.
  el.classList.toggle('fresh', i === unlocked - 1 && currentGuesses().length > 0);
  document.getElementById('photoPrev').disabled = i <= 0;
  document.getElementById('photoNext').disabled = i >= unlocked - 1;
}

function renderClues(target){
  // Between rounds the pending pin has to go, or the confirm bar would still
  // be offering the previous round's guess.
  if(roundFinished()) clearPending(); else renderTapHint();

  const T = t();
  const keys = ['continent','category','year','region','clue'];
  const box = document.getElementById('clues'); box.innerHTML = '';
  keys.forEach((key,i)=>{
    const unlocked = currentGuesses().length > i || roundFinished();
    const div = document.createElement('div');
    div.className = 'clue' + (key==='clue' ? ' full' : '') + (unlocked ? ' unlocked' : ' locked');
    let value = '···';
    if(unlocked){
      if(key==='continent') value = target.continent[lang];
      else if(key==='category') value = target.category[lang];
      else if(key==='year') value = target.year ? `${Math.floor(target.year/10)*10}s` : '—';
      else if(key==='region') value = regionOf(target);
      else if(key==='clue') value = (target.clue && target.clue[lang]) || '—';
    }
    div.innerHTML = `<span class="label">${T.clueLabels[i]}</span>${value}`;
    box.appendChild(div);
  });
}

function renderHistory(){
  const T = t();
  const box = document.getElementById('history'); box.innerHTML = '';
  [...currentGuesses()].reverse().forEach(g=>{
    const entry = COUNTRIES.find(c=>c.id===g.id);
    if(!entry) return;  // stored guess from a previous pool
    const row = document.createElement('div'); row.className = 'hist-row';
    const tag = (ok, label) =>
      `<span class="hist-tag ${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'} ${label}</span>`;
    const tags = g.contOk === undefined ? '' :
      `<span class="hist-tags">${tag(g.contOk, T.clueLabels[0])}${tag(g.regionOk, T.clueLabels[3])}</span>`;
    // km before the tags: the tags claim a full row, so anything after them
    // wraps onto a third line.
    row.innerHTML = `<span class="hist-dot" data-glyph="${heatGlyph[g.bucket]||''}" style="background:${heatColorVar[g.bucket]}"></span>
      <span class="hist-name">${entry.names[lang]}</span>
      <span class="hist-km">${g.km} km ${dirLabel(g.bearing)}</span>${tags}`;
    box.appendChild(row);
  });
}

function renderMapForRound(){
  buildMap();
  currentGuesses().forEach((g,i)=>{
    const e = COUNTRIES.find(c=>c.id===g.id);
    if(e) addPin(e.lat, e.lng, g.bucket, i===currentGuesses().length-1);
  });
  // The provisional pin: where the last tap landed, before it is committed.
  if(pendingCountry && !roundFinished()){
    addPin(pendingCountry.lat, pendingCountry.lng, 'pending', true);
  }
  // Nothing to spoil any more: the round is scored by the guesses themselves,
  // so the site is marked as soon as the round is over.
  if(roundFinished()) addTargetPin(currentTarget().lat, currentTarget().lng);
  const T = t();
  const readout = document.getElementById('mapReadout');
  const gs = currentGuesses();
  if(!gs.length){
    readout.className = 'map-readout';
    readout.style.removeProperty('--lg-accent');
    // What the bonus round is worth, and that it has three tries: said
    // before the first guess, because afterwards it is no use.
    readout.textContent = roundPlan(state.round).bonus ? T.bonusIntro : T.readoutStart;
  } else {
    // Same verdict the history row carries, restated where it cannot be
    // missed: which country, how far off, and whether the continent and
    // region were right.
    const last = gs[gs.length-1];
    const e = COUNTRIES.find(c => c.id === last.id);
    const tag = (ok, label) =>
      `<span class="hist-tag ${ok ? 'ok' : 'no'}">${ok ? '\u2713' : '\u2717'} ${label}</span>`;
    const tags = last.contOk === undefined ? '' :
      `<span class="hist-tags">${tag(last.contOk, T.clueLabels[0])}${tag(last.regionOk, T.clueLabels[3])}</span>`;
    readout.className = 'map-readout last-guess';
    readout.style.setProperty('--lg-accent', heatColorVar[last.bucket]);
    readout.innerHTML =
      `<span class="lg-head">
         <span class="hist-dot" data-glyph="${heatGlyph[last.bucket]||''}" style="background:${heatColorVar[last.bucket]}"></span>
         <b>${e ? e.names[lang] : ''}</b>
       </span>
       <span class="lg-dist">${T.readout(last.km, dirLabel(last.bearing))}</span>
       ${tags}`;
  }
}

function totalScore(){ return Math.round(state.roundScore.reduce((a,b)=>a+b,0)); }

function renderRoundResult(){
  const box = document.getElementById('roundResult');
  const T = t(); const target = currentTarget();
  if(!roundFinished()){ box.hidden = true; return; }
  box.hidden = false;
  const solved = state.roundStatus[state.round] === 'solved';
  const grid = currentGuesses().map(g=>heatEmoji[g.bucket]).join(' ');
  const pts = Math.round(state.roundScore[state.round]);
  const max = Math.round(roundPlan(state.round).points);
  // The site name is the reward, not the puzzle: it is revealed either way,
  // alongside the country that was the actual answer.
  const several = !!(target.countryNames && target.countryNames.length > 1);
  const answerNames = several
    ? target.countryNames.map(n => n[lang] || n.en).join(' \u00b7 ')
    : target.country[lang];
  const reveal = `<p>${several ? T.countriesWere : T.answerWas} <b>${answerNames}</b><br>
                  <span style="color:var(--cream)">${target.names[lang]}</span></p>`;
  // A missed round still scores by proximity, so the points line is the real
  // outcome -- "Round over" alone used to read as zero.
  const last = currentGuesses()[currentGuesses().length - 1];
  const lastName = last && (COUNTRIES.find(c=>c.id===last.id) || {}).names;
  const pointsBlock = solved
    ? `<p class="pts">${T.pointsFull(pts, max)}</p>`
    : `<p class="pts">${T.pointsPartial(pts, max, lastName ? lastName[lang] : '', last ? last.km : 0)}</p>`;
  box.innerHTML = `
    <span class="tier-badge">${roundPlan(state.round).bonus ? T.bonusBadge : T.tier[target.tier]}</span>
    <h2>${solved ? T.win : T.lose}</h2>
    <p>${solved ? T.winSub(currentGuesses().length) : ''}</p>
    ${reveal}
    <div class="share-grid">${grid}</div>
    ${pointsBlock}
    <button class="btn" id="nextBtn">${state.round + 1 >= N_ROUNDS ? T.seeResult : T.nextRound}</button>
    <button class="btn secondary" id="learnBtn">${T.learnMore}</button>`;
  document.getElementById('nextBtn').onclick = ()=>{
    state.round++; photoView[state.round] = 0; saveState(); render();
  };
  document.getElementById('learnBtn').onclick = ()=> openInfoModal(target);
  clearPending();
  // The round is over and the verdict sits below the map; on a phone that is
  // off-screen, so the round appeared to end with nothing happening.
  // Keyed to the round: the element is reused, so a plain flag would scroll
  // once and never again for rounds 2 and 3.
  if(box.dataset.shown !== String(state.round)){
    box.dataset.shown = String(state.round);
    box.scrollIntoView({ behavior:'smooth', block:'center' });
  }
}

/* SVG path data for a set of flat [x,y,x,y,...] rings. */
function ringsToPath(rings){
  const out = [];
  for(const r of rings){
    if(r.length < 6) continue;
    let d = 'M' + r[0] + ',' + r[1];
    for(let i = 2; i < r.length; i += 2) d += 'L' + r[i] + ',' + r[i+1];
    out.push(d + 'Z');
  }
  return out.join('');
}

/* ---------- Resolving a tap to a country ----------
   The guess is a point on the map, so a tap has to say which country it landed
   in. Ray casting over that country's rings, even-odd, so a point inside a
   hole (an enclave cut out of the surrounding country) counts as outside.
   Bounding boxes first, because testing 200 countries vertex by vertex on
   every tap is work that is almost entirely wasted. */
function buildShapeIndex(){
  SHAPE_BOX = null;
  if(!LAND_SHAPES) return;
  SHAPE_BOX = {};
  for(const iso in LAND_SHAPES){
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for(const r of LAND_SHAPES[iso]){
      for(let i = 0; i < r.length; i += 2){
        if(r[i]   < x0) x0 = r[i];
        if(r[i]   > x1) x1 = r[i];
        if(r[i+1] < y0) y0 = r[i+1];
        if(r[i+1] > y1) y1 = r[i+1];
      }
    }
    SHAPE_BOX[iso] = [x0, y0, x1, y1];
  }
}

function pointInShape(rings, x, y){
  let inside = false;
  for(const r of rings){
    const n = r.length / 2;
    for(let k = 0, l = n - 1; k < n; l = k++){
      const xi = r[2*k], yi = r[2*k+1], xj = r[2*l], yj = r[2*l+1];
      if(((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)){
        inside = !inside;
      }
    }
  }
  return inside;
}

/* ISO of the country under a world-space point, or null for open water. */
function isoAt(x, y){
  if(!LAND_SHAPES || !SHAPE_BOX) return null;
  for(const iso in LAND_SHAPES){
    const b = SHAPE_BOX[iso];
    if(x < b[0] || x > b[2] || y < b[1] || y > b[3]) continue;
    if(pointInShape(LAND_SHAPES[iso], x, y)) return iso;
  }
  return null;
}

/* A country too small to have a polygon at this resolution -- Vatican City is
   400m across -- would otherwise be impossible to guess even though it holds
   inscriptions. Fall back to the nearest centroid within about ten screen
   pixels, which is tight enough that it never hijacks a tap on open sea. */
const SNAP_PX = 10;
function countryNear(x, y){
  const perPx = mapView.w / (document.getElementById('mapSvg').getBoundingClientRect().width || 1);
  const limit = SNAP_PX * perPx;
  let best = null, bestD = Infinity;
  for(const c of COUNTRIES){
    const p = project(c.lat, c.lng);
    const d = Math.hypot(p.x - x, p.y - y);
    if(d < bestD){ bestD = d; best = c; }
  }
  return bestD <= limit ? best : null;
}

/* The guessable country carrying that ISO code, if the dataset knows it. */
function countryByIso(iso){
  if(!iso) return null;
  return COUNTRIES.find(c => c.iso === iso) || null;
}

/* The pin-drop bonus that used to live here is gone. It asked the player to
   place the exact spot after the round had already revealed it, and scoring is
   distance-based now, so precision is measured by the guess itself. */

/* Pan by dragging, zoom by wheel or pinch. panMoved distinguishes a drag from
   a tap, so a drag is never mistaken for a click on the map. */
let panMoved = false;
(function setupMapGestures(){
  const svg = document.getElementById('mapSvg');
  const pointers = new Map();
  let last = null, pinchStart = 0, startW = 0;
  // Measured once per gesture. getBoundingClientRect forces the browser to
  // settle layout, and calling it on every pointermove of a drag was paying
  // that cost dozens of times for a number that cannot change mid-drag.
  let rect = null;
  const svgRect = ()=> (rect || (rect = svg.getBoundingClientRect()));

  svg.addEventListener('pointerdown', e=>{
    pointers.set(e.pointerId, e);
    panMoved = false;
    rect = null;
    if(pointers.size === 1){ last = { x:e.clientX, y:e.clientY }; }
    if(pointers.size === 2){
      const [a,b] = [...pointers.values()];
      pinchStart = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      startW = mapView.w;
    }
    svg.setPointerCapture(e.pointerId);
  });

  svg.addEventListener('pointermove', e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, e);
    if(pointers.size === 2 && pinchStart){
      const [a,b] = [...pointers.values()];
      const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      if(dist > 0){
        // Worked out entirely in numbers, then drawn once: the midpoint has to
        // stay under the fingers, which needs the clamped view, not a redraw.
        const mx = (a.clientX+b.clientX)/2, my = (a.clientY+b.clientY)/2;
        const before = screenToWorld(mx, my);
        mapView.w = startW * (pinchStart / dist);
        clampView();
        const after = screenToWorld(mx, my);
        mapView.x += before.x - after.x; mapView.y += before.y - after.y;
        scheduleView();
        panMoved = true;
      }
      return;
    }
    if(pointers.size === 1 && last){
      const r = svgRect();
      const dx = (e.clientX - last.x) / r.width * mapView.w;
      const dy = (e.clientY - last.y) / r.height * mapView.h;
      if(Math.abs(e.clientX-last.x) + Math.abs(e.clientY-last.y) > 3) panMoved = true;
      // Only pan once zoomed in; at full extent there is nowhere to go.
      if(mapView.w < MAP_W){
        mapView.x -= dx; mapView.y -= dy; clampView(); scheduleView();
      }
      last = { x:e.clientX, y:e.clientY };
    }
  });

  const release = e=>{
    pointers.delete(e.pointerId);
    if(pointers.size < 2) pinchStart = 0;
    if(pointers.size === 0){ last = null; rect = null; applyView(); }
  };
  svg.addEventListener('pointerup', release);
  svg.addEventListener('pointercancel', release);

  svg.addEventListener('wheel', e=>{
    e.preventDefault();
    const w = screenToWorld(e.clientX, e.clientY);
    zoomBy(e.deltaY < 0 ? 1.25 : 1/1.25, w.x, w.y);
  }, { passive:false });

  document.getElementById('zoomIn').onclick  = ()=> zoomBy(1.6);
  document.getElementById('zoomOut').onclick = ()=> zoomBy(1/1.6);
  document.getElementById('zoomReset').onclick = ()=>{
    mapView = { x:0, y:0, w:MAP_W, h:MAP_H }; applyView();
  };
})();

/* ---------- Info modal ---------- */
/* Where to go to actually learn about the thing.

   No video is embedded and none is chosen for you. Picking one automatically
   would mean a blind search over two thousand mostly obscure subjects, and a
   confidently wrong video is worse than none -- so the video link opens a
   search and you choose. The official listing is the better bet anyway: those
   pages carry the nomination films and documents.

   Everything here is built from fields the entry already has, so a link is
   offered only when it will actually resolve. */
function learnLinks(entry){
  const T = t();
  const out = [];
  // Every row has the same shape: a mark, the label, and the sign that it
  // leaves the game. Reading down them should feel like a list, not a jumble.
  const a = (href, mark, label) =>
    `<a class="learn-link" href="${href}" target="_blank" rel="noopener noreferrer">
       <span class="ll-mark" aria-hidden="true">${mark}</span>
       <span class="ll-text">${label}</span>
       <span class="ll-go" aria-hidden="true">↗</span></a>`;

  // One place to read about it. The official listing where the entry has one;
  // otherwise the encyclopaedia, but only for entries whose article title the
  // build checked against the API -- the titles come from Wikidata's sitelinks
  // and a share of them no longer resolve, and a link that lands on nothing is
  // worse than one that was never offered.
  const w = entry.wiki || {};
  const wlang = w[lang] ? lang : (w.en ? 'en' : (w.fr ? 'fr' : (w.es ? 'es' : null)));
  if(entry.siteId){
    out.push(a(`https://whc.unesco.org/en/list/${encodeURIComponent(entry.siteId)}`,
               '§', T.linkOfficial));
  } else if(entry.officialUrl){
    out.push(a(entry.officialUrl, '§', T.linkOfficial));
  } else if(wlang){
    out.push(a(`https://${wlang}.wikipedia.org/wiki/${encodeURIComponent(w[wlang])}`,
               'W', T.linkWiki));
  }

  // Last, and named after the thing itself: "videos about X" says what you get,
  // where "find videos" said only what the button does.
  const name = (entry.names && (entry.names[lang] || entry.names.en)) || '';
  const country = entry.country
    ? (typeof entry.country === 'string' ? entry.country
       : (entry.country.en || entry.country[lang] || '')) : '';
  const q = encodeURIComponent(((entry.names && entry.names.en) || name) + ' ' + country);
  out.push(a(`https://www.youtube.com/results?search_query=${q}`, '▶', T.linkVideo(name)));
  return out;
}

function openInfoModal(entry, rec){
  const T = t();

  const names = entry.names || {};

/* Swipe, because on a phone reaching for a small arrow is not what a hand

(function swipeGallery(){
  const gal = document.getElementById('gal');
  let x0 = null, y0 = null;
  gal.addEventListener('touchstart', e=>{
    const t = e.changedTouches[0]; x0 = t.clientX; y0 = t.clientY;

/* ---------- The mark: a menu, and a spinning top ----------

   A quick tap opens the menu. Holding winds the little person up like a top --
   faster the longer you hold -- and letting go lets him coast down under
   friction and stop wherever his momentum leaves him, which is the whole point
   of a top and the reason this is not a CSS animation: there is no fixed
   duration and no tidy final angle.

   Holding is not a tap, so a long press does not also toggle the menu. */
const SPIN = {
  windUp:   1200,   // deg/s^2 while held
  topSpeed: 4320,   // deg/s -- twelve turns a second, a proper blur
  drag:     1.1,    // proportional slowdown, s^-1
  friction: 200,    // deg/s^2 -- constant, so it actually stops
  stopBelow: 26,    // deg/s, under which it is at rest
  tapMs:    260     // longer than this is a hold, not a tap
};
const DIZZY_TURNS = 100;

(function markTop(){
  const mark = document.getElementById('mark');
  const menu = document.getElementById('markMenu');
  if(!mark || !menu) return;
  const img = mark.querySelector('img');
  const dim = document.getElementById('markDim');
  const calm = matchMedia('(prefers-reduced-motion: reduce)');

  const setOpen = (open)=>{
    // An empty menu is not worth opening: with nothing configured there is
    // nothing in it, and a blank panel reads as a bug.
    const has = menu.children.length > 0;
    menu.hidden = !(open && has);
    if(dim) dim.hidden = menu.hidden;   // the page goes quiet behind it
    mark.setAttribute('aria-expanded', String(!menu.hidden));
  };

  let angle = 0, vel = 0, held = false, raf = null, last = 0;
  let turnedThisSpin = 0;             // degrees since the top started moving
  let pressedAt = 0;

  function frame(now){
    const dt = Math.min(0.05, (now - last) / 1000) || 0;
    last = now;
    if(held) vel = Math.min(SPIN.topSpeed, vel + SPIN.windUp * dt);
    else if(vel > 0){
      vel = Math.max(0, vel * (1 - SPIN.drag * dt) - SPIN.friction * dt);
      if(vel < SPIN.stopBelow) vel = 0;
    }
    const step = vel * dt;
    angle += step;
    turnedThisSpin += step;
    img.style.transform = `translateZ(0) rotate(${angle}deg)`;
    if(turnedThisSpin >= DIZZY_TURNS * 360 && !profile.dizzy && !isPractice){
      // Hidden until it happens, which is the point of it.
      profile.dizzy = true;
      saveProfile();
      const fresh = checkAchievements();
      if(fresh.length) showDizzy();
    }
    if(!held && vel === 0){
      raf = null;
      mark.classList.remove('spinning');
      turnedThisSpin = 0;             // "in a row" means one continuous spin
      return;                        // left at whatever angle it stopped on
    }
    raf = requestAnimationFrame(frame);
  }

  function start(){
    if(calm.matches) return;          // no wind-up for anyone who asked for none
    mark.classList.add('spinning');
    if(raf === null){ last = performance.now(); raf = requestAnimationFrame(frame); }
  }

  mark.addEventListener('pointerdown', (e)=>{
    e.preventDefault();               // or a long press selects the image
    pressedAt = performance.now();
    held = true;
    start();
    try{ mark.setPointerCapture(e.pointerId); }catch(err){ /* not fatal */ }
  });
  const release = ()=>{
    if(!held) return;
    held = false;
    const quick = performance.now() - pressedAt < SPIN.tapMs;
    // A tap is a request for the menu; a hold was a request for a spin, and
    // opening the menu over it afterwards is not what the hand asked for.
    if(quick){
      if(calm.matches || vel === 0) vel = Math.max(vel, 900);  // a flick, for the tap
      start();
      setOpen(menu.hidden);
    }
  };
  mark.addEventListener('pointerup', release);
  mark.addEventListener('pointercancel', release);
  mark.addEventListener('lostpointercapture', release);
  // Keyboard: a click with no pointer behind it is Enter or Space on the
  // button, which should open the menu and give him a turn.
  mark.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(e.detail === 0){ vel = Math.max(vel, 900); start(); setOpen(menu.hidden); }
  });

  // Anywhere else, or Escape, closes it -- including a tap on the board, which
  // is what a hand reaches for when it wants the menu gone.
  document.addEventListener('click', (e)=>{
    if(!menu.hidden && !menu.contains(e.target) && !mark.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && !menu.hidden){ setOpen(false); mark.focus(); }
  });
})();

/* ---------- Guessing ---------- */
function submitGuess(country){
  if(state.round >= N_ROUNDS || roundFinished()) return;
  const guesses = currentGuesses();
  if(guesses.some(g=>g.id===country.id)) return;
  const target = currentTarget(), answers = targetCountries();
  // Distance runs from the guessed country to the *site*, so the heat keeps
  // pointing at the real place even once you are in the right country. For a
  // multinational element it runs to the nearest of its countries instead.
  const km = Math.round(answerDistanceKm(country));
  const brg = bearing(country.lat, country.lng, target.lat, target.lng);
  const isCorrect = answers.length
    ? answers.some(a => a.id === country.id)
    : country.names.en === target.country.en;
  guesses.push({ id: country.id, km, bearing: brg,
                 bucket: isCorrect ? 'correct' : heatBucket(km),
                 // Distance alone is hard to act on. Saying which of continent
                 // and region a guess already matched turns each try into a
                 // narrowing step rather than a number to interpret.
                 // Judged against any of the answer countries, for the same
                 // reason the answer itself is: a tradition shared across two
                 // continents is not "the wrong continent".
                 contOk: !!(contCodeOf(country) && (answers.length > 1
                        ? answers.some(a => contCodeOf(a) === contCodeOf(country))
                        : contCodeOf(country) === contCodeOf(target))),
                 regionOk: answers.length > 1
                        ? answers.some(a => regionOf(a) === regionOf(country))
                        : regionOf(country) === regionOf(target) });

  const max = roundPlan(state.round).points;
  if(isCorrect){
    state.roundStatus[state.round] = 'solved';
    state.roundScore[state.round] = max;          // full points, round over
    catalogue(target, true);
    // "Sharp eye": a tier-3 entry taken on the very first guess.
    if(target.tier === 3 && guesses.length === 1 && !isPractice){
      profile.gemFirstGuess = true; saveProfile();
    }
  } else if(guesses.length >= guessesAllowed(state.round)){
    // Out of guesses. The last guess is what scores -- not the best one, and
    // not nothing: a near miss is worth most of the round.
    state.roundStatus[state.round] = 'failed';
    state.roundScore[state.round] = max * proximity(km, false);
    catalogue(target, false);   // revealed on failure still enters the catalogue
  }
  saveState();
  clearPending();
  showNewestPhoto();      // a guess just earned one; show what it bought
  render();
  // On a phone the verdict panel sits just below the fold, so a guess looked
  // like it had done nothing at all. 'nearest' scrolls only when it is
  // actually off-screen, which leaves the desktop layout alone.
  if(!roundFinished()){
    document.getElementById('mapReadout')
            .scrollIntoView({ behavior:'smooth', block:'nearest' });
  }
}

/* ---------- Guessing by tapping the map ----------
   The guess is a place, not a word. Typing a country name asked the player to
   already know the answer in order to enter it; pointing at the map is the
   same act the puzzle is about.

   A tap proposes and the button commits. With three guesses a round and a map
   only 375px wide, a stray tap that spent a guess outright would be the most
   annoying thing in the game. */
let pendingCountry = null;

function clearPending(){
  pendingCountry = null;
  const p = document.getElementById('pendingGuess');
  if(p) p.hidden = true;
  renderTapHint();
}

function renderTapHint(){
  const hint = document.getElementById('tapHint');
  if(!hint) return;
  const T = t();
  if(roundFinished()){ hint.textContent = ''; return; }
  hint.textContent = pendingCountry ? T.tapAgain : T.tapPrompt;
}

function showPending(country){
  pendingCountry = country;
  const box = document.getElementById('pendingGuess');
  document.getElementById('pendingName').textContent = country.names[lang];
  document.getElementById('confirmGuess').textContent = t().confirmGuess;
  box.hidden = false;
  renderTapHint();
  // On a phone the confirm bar sits below the map, off the bottom of the
  // screen: the pin would appear with no visible way to commit it.
  box.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function flashHint(msg){
  const hint = document.getElementById('tapHint');
  if(!hint) return;
  hint.textContent = msg;
  clearTimeout(flashHint.timer);
  flashHint.timer = setTimeout(renderTapHint, 2200);
}

function handleMapTap(evt){
  if(roundFinished() || state.round >= N_ROUNDS) return;
  if(panMoved) return;                       // that was a drag, not a tap
  const w = screenToWorld(evt.clientX, evt.clientY);
  const iso = isoAt(w.x, w.y);
  let country = countryByIso(iso);
  // Nothing under the point, or a country the dataset has no entries for:
  // try the microstate snap before giving up.
  if(!country) country = countryNear(w.x, w.y);
  if(!country){ flashHint(iso ? t().tapUnknown : t().tapWater); return; }
  if(currentGuesses().some(g => g.id === country.id)){
    // Already guessed: say so rather than silently doing nothing.
    flashHint(country.names[lang] + ' \u2713');
    return;
  }
  showPending(country);
  renderMapForRound();                        // draw the provisional pin
}

(function aboutPanel(){
  const back = document.getElementById('aboutBackdrop');
  document.getElementById('aboutClose').addEventListener('click',
    ()=> back.classList.remove('open'));
  back.addEventListener('click', e=>{
    if(e.target === back) back.classList.remove('open');
  });
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape') back.classList.remove('open');
  });
})();

function renderCollection(){
  const T = t();
  const items = Object.values(profile.collection).sort((a,b)=> b.day - a.day);
  const box = document.getElementById('viewCollection');
  if(!items.length){
    box.innerHTML = `<div class="panel-head"><h2>${T.collectionTitle}</h2>
      <p>${T.collectionEmpty}</p></div>`;
    return;
  }
  // Favourites first and in the order they were starred: a shelf the player
  // arranged themselves, not another view of the same list.
  const favs = items.filter(r => isFavourite(r.id))
                    .sort((a,b)=> profile.favourites[b.id] - profile.favourites[a.id]);
  const rest = items.filter(r => !isFavourite(r.id));
  const section = (title, sub, list) =>
    `<div class="panel-head"><h2>${title}</h2><p>${sub}</p></div>
     <div class="cards">${list.map(collectionCard).join('')}</div>`;

  box.innerHTML =
    (favs.length ? section(T.favTitle, T.favSub(favs.length), favs) : '') +
    section(favs.length ? T.collectionRest : T.collectionTitle,
            favs.length ? T.collectionSub(items.length) : T.collectionSub(items.length),
            rest) +
    (favs.length ? '' : `<p class="fav-hint">${T.favHint}</p>`);

  box.querySelectorAll('[data-fav]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();                 // starring is not opening
      toggleFavourite(btn.dataset.fav);
      renderCollection();
    });
  });
  const open = el=>{
    const rec = profile.collection[el.dataset.id];
    if(rec) openInfoModal(liveEntry(rec), rec);
  };
  box.querySelectorAll('.card[data-id]').forEach(card=>{
    card.addEventListener('click', ()=> open(card));
    card.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(card); }
    });
  });
}

function renderPassport(){
  const T = t();
  const st = streaks();
  const days = Object.entries(profile.days).map(([d,v])=>({ day:+d, ...v }))
                     .sort((a,b)=> b.day - a.day);
  const avg = days.length
    ? Math.round(days.reduce((a,b)=>a+(b.score||0),0) / days.length) : 0;
  const stamps = days.map(d=>{
    const tier = d.score >= 80 ? 3 : (d.score >= 40 ? 2 : 1);
    return `<div class="stamp s${tier}" title="Day ${d.day}">
      <b>${Math.round(d.score)}</b><span>#${d.day}</span></div>`;
  }).join('');
  // Earned on the page, locked out of sight. Twenty-two rows of mostly grey is
  // a list of things you have not done; what a player comes back to is the page
  // of stamps they have. The rest are one tap away for whoever wants to know.
  //
  // Three to a row, the stamp and its name on the tile, and the description
  // only when asked for -- a full-width row each turns a page of stamps into a
  // list again, which is the opposite of what a passport looks like.
  const shown = visibleAchievements();
  const earned = shown.filter(a => profile.achievements.includes(a.id));
  const locked = shown.filter(a => !profile.achievements.includes(a.id));
  const achEarned = earned.length
    ? achGrid(earned, true)
    : `<p class="ach-empty">${T.achEmpty}</p>`;
  const achLocked = locked.length
    ? `<details class="ach-locked"><summary>${T.achLocked}
         <span class="count">${locked.length}</span></summary>
       ${achGrid(locked, false)}</details>`
    : `<p class="ach-empty">${T.achLockedNone}</p>`;
  const ach = achEarned + achLocked;
  document.getElementById('viewPassport').innerHTML =
    `<div class="panel-head"><h2>${T.passportTitle}</h2><p>${T.passportSub}</p></div>
     <div class="stats">
       <div class="stat"><b>${st.played}</b><span>${T.statPlayed}</span></div>
       <div class="stat"><b>${st.current}</b><span>${T.statStreak}</span></div>
       <div class="stat"><b>${st.best}</b><span>${T.statBest}</span></div>
       <div class="stat"><b>${avg}</b><span>${T.statAvg}</span></div>
     </div>
     <div class="stamps">${stamps}</div>
     <div class="panel-head" style="margin-top:20px"><h2>${T.achTitle}</h2>
       <p>${T.achEarned} ${earned.length} / ${shown.length}</p></div>
     ${ach}
     <label class="cb-row"><input type="checkbox" id="cbToggle"
       ${cbOn() ? 'checked' : ''}> ${T.cbLabel}</label>
     <p class="cb-note">${T.cbNote}</p>`;
  document.getElementById('cbToggle').onchange = e=>{
    profile.colorblind = e.target.checked; saveProfile(); applyColorblind(); render();
  };
  document.querySelectorAll('#viewPassport [data-ach]').forEach(tile=>{
    tile.addEventListener('click', ()=>{
      // Tapping the open one closes it, so the grid can go back to being a grid.
      achOpen = (achOpen === tile.dataset.ach) ? null : tile.dataset.ach;
      const wasOpen = document.querySelector('.ach-locked')?.hasAttribute('open');
      renderPassport();
      // Re-rendering would otherwise fold the locked list shut under the hand
      // of whoever just tapped something inside it.
      if(wasOpen) document.querySelector('.ach-locked')?.setAttribute('open', '');
    });
  });
}

/* Which distinction is showing its description, if any. */
let achOpen = null;

/* A grid of stamps, with the description of the open one spliced in at the end
   of its own row rather than at the bottom of the grid -- on a page of twenty
   tiles, a detail panel far from the tile you tapped reads as unrelated. */
function achGrid(list, got){
  const cols = 3;
  const open = list.find(a => a.id === achOpen);
  const out = [];
  list.forEach((a, i)=>{
    const [name] = achText(a);
    out.push(`<button class="ach-tile${got ? '' : ' locked'}` +
             `${achOpen === a.id ? ' on' : ''}" data-ach="${a.id}"` +
             ` aria-expanded="${achOpen === a.id}">` +
             `${stampSvg(a.mark, got)}<span>${name}</span></button>`);
    const rowStart = Math.floor(i / cols) * cols;
    const lastInRow = (i % cols === cols - 1) || i === list.length - 1;
    if(open && lastInRow && list.slice(rowStart, i + 1).some(x => x.id === achOpen)){
      const [name2, desc] = achText(open);
      out.push(`<div class="ach-detail">${stampSvg(open.mark, got)}
        <div><b>${name2}</b><span>${desc}</span></div></div>`);
    }
  });
  return `<div class="ach-grid">${out.join('')}</div>`;
}

function renderArchive(){
  const T = t();
  const rows = [];
  for(let d = todayIndex; d >= Math.max(0, todayIndex - 60); d--){
    const rec = profile.days[d];
    const date = new Date(EPOCH + d * 86400000).toISOString().slice(0,10);
    // A link only where there is something to go back to: today, or a day this
    // player finished. An unplayed day has no replay, because that link was
    // the back catalogue.
    const openable = d === todayIndex || !!rec;
    rows.push(`<div class="arch-row">
      <span class="arch-day">${date}${d===todayIndex ? ' ·' : ''}</span>
      <span class="arch-score">${rec ? T.scoreOf(Math.round(rec.score), MAX_SCORE) : '—'}</span>
      ${openable
        ? `<a class="btn secondary" style="font-size:0.68rem;padding:7px 11px"
              href="${d === todayIndex ? '.' : '?day=' + d}">${
                d===todayIndex ? T.navGame : T.archiveOpen}</a>`
        : `<span class="arch-locked">${T.archiveMissed}</span>`}</div>`);
  }
  document.getElementById('viewArchive').innerHTML =
    `<div class="panel-head"><h2>${T.archiveTitle}</h2><p>${T.archiveSub}</p></div>
     <div class="arch-list">${rows.join('')}</div>`;
}

/* ---------- Countdown ---------- */
function renderCountdown(){
  const T = t();
  const el = document.getElementById('countdown');
  if(!el) return;
  const nextUtcMidnight = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) + 86400000;
  const tick = ()=>{
    const left = nextUtcMidnight - Date.now();
    if(left <= 0){ el.innerHTML = ''; return; }
    const h = String(Math.floor(left/3600000)).padStart(2,'0');
    const m = String(Math.floor(left/60000) % 60).padStart(2,'0');
    const sec = String(Math.floor(left/1000) % 60).padStart(2,'0');
    el.innerHTML = `${T.nextIn} <b>${h}:${m}:${sec}</b>`;
  };
  tick();
  clearInterval(renderCountdown._t);
  renderCountdown._t = setInterval(tick, 1000);
}

/* ---------- Field Notes (first visit only) ---------- */
function maybeFieldNotes(){
  if(profile.seenFieldNotes) return;
  const T = t();
  document.getElementById('fnTitle').textContent = T.fieldNotesTitle;
  document.getElementById('fnBody').innerHTML =
    T.fieldNotes.map(p=>`<p>${p}</p>`).join('');
  document.getElementById('fnClose').textContent = T.fieldNotesBtn;
  document.getElementById('fieldNotesBackdrop').classList.add('open');
}
document.getElementById('fnClose').addEventListener('click', ()=>{
  document.getElementById('fieldNotesBackdrop').classList.remove('open');
  profile.seenFieldNotes = true; saveProfile();
});

/* ---------- Init ---------- */
/* ---------- Answers have to be reachable ----------
   The guess is a tap, so a country the map cannot resolve a tap to cannot be
   an answer -- a round whose only answer is unreachable is unwinnable. The
   pipeline already drops countries with no ISO code, but it does not know what
   the map can actually hit: Vatican City is 400 metres across, has no polygon
   at this resolution, and sits inside Italy, so every tap on it returns Italy.

   Enforced here rather than in the pipeline because this is the only place
   that has both the dataset and the geometry, and it re-checks itself whenever
   either changes. */
function pruneUnreachable(){
  if(!LAND_SHAPES || !COUNTRIES.length) return;
  const ok = new Set();
  for(const c of COUNTRIES){
    if(!c.iso) continue;
    if(LAND_SHAPES[c.iso]){ ok.add(c.id); continue; }   // tap inside it
    const p = project(c.lat, c.lng);                     // or snap to it
    const got = countryByIso(isoAt(p.x, p.y)) || countryNear(p.x, p.y);
    if(got && got.id === c.id) ok.add(c.id);
  }
  const lostCountries = COUNTRIES.filter(c => !ok.has(c.id)).map(c => c.names.en);
  COUNTRIES = COUNTRIES.filter(c => ok.has(c.id));
  const before = POOL.length;
  POOL = POOL.filter(e => {
    const ids = (e.countryIds || []).filter(id => ok.has(id));
    if(!ids.length) return false;
    // Keep the entry, but only the answers a player could actually give.
    if(ids.length !== (e.countryIds || []).length){
      e.countryNames = e.countryNames.filter((_, i) => ok.has(e.countryIds[i]));
      e.countryIds = ids;
      if(e.countryNames.length) e.country = e.countryNames[0];
    }
    return true;
  });
  if(lostCountries.length || POOL.length !== before){
    console.warn('Heritle: dropped ' + lostCountries.length +
      ' country/countries the map cannot resolve (' + lostCountries.join(', ') +
      ') and ' + (before - POOL.length) + ' entry/entries left with no reachable answer.');
  }
  BY_ID = new Map(POOL.map(d => [d.id, d]));
  computeTargets();
}

// Both in parallel: the map geometry is independent of the dataset, and
// neither blocks the other. loadLand never rejects -- a missing file falls
// back to the built-in outline -- so the game still starts if it is absent.
Promise.all([loadDataset(), loadLand()]).then(()=>{
  pruneUnreachable();
  applyColorblind();
  if(isPractice){
    const b = document.createElement('div');
    b.className = 'practice-banner';
    b.innerHTML = `${t().practiceBadge} · <a href="./" style="color:var(--gold)">${t().backToToday}</a>`;
    document.getElementById('viewGame').prepend(b);
  }
  render();
  renderNav();
  renderCountdown();
  maybeFieldNotes();
});
