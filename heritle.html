<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heritle — three heritage guesses a day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#131D34; --navy-2:#1B2A4A; --navy-3:#233A63;
    --cream:#F3EEDF; --ink:#E7E1CF; --ink-dim:#9CA6C0;
    --gold:#C9A24B; --gold-dim:#8E7333;
    --heat-far:#3E5C86; --heat-mid:#8C6A46; --heat-close:#B8532E; --heat-hot:#8E2F1D; --correct:#5C8A5C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; min-height:100dvh; background:var(--navy); color:var(--ink);
    font-family:'Inter',sans-serif; display:flex; justify-content:center;
    /* dvh so the iOS URL bar can't add phantom height; env() keeps content
       clear of the notch and home indicator, which matters in landscape. */
    padding:28px 14px 64px;
    padding-left:max(14px, env(safe-area-inset-left));
    padding-right:max(14px, env(safe-area-inset-right));
    padding-bottom:max(64px, calc(env(safe-area-inset-bottom) + 40px));
    -webkit-tap-highlight-color:rgba(201,162,75,0.25);
  }
  button{touch-action:manipulation;}
  .page{width:100%;max-width:480px;}
  header{text-align:center;margin-bottom:16px;}
  .wordmark{font-family:'Playfair Display',serif;font-weight:700;font-size:2.4rem;color:var(--cream);}
  .tagline{color:var(--ink-dim);font-size:0.85rem;margin-top:4px;}
  .lang-slider{display:inline-flex;margin-top:14px;border:1px solid var(--gold-dim);border-radius:999px;overflow:hidden;}
  .lang-btn{background:transparent;border:none;color:var(--ink-dim);font-family:'JetBrains Mono',monospace;font-size:0.72rem;padding:6px 13px;cursor:pointer;}
  .lang-btn.active{background:var(--gold);color:var(--navy);font-weight:500;}

  .rounds-row{display:flex;justify-content:center;gap:8px;margin:16px 0 10px;}
  .round-pip{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:0.75rem;border:1px solid var(--gold-dim);color:var(--ink-dim);}
  .round-pip.current{border-color:var(--gold);color:var(--cream);}
  .round-pip.done-solved{background:var(--correct);border-color:var(--correct);color:var(--navy);}
  .round-pip.done-failed{background:var(--heat-hot);border-color:var(--heat-hot);color:var(--cream);}

  .meta-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;
    font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--ink-dim);}
  .mode-badge{border:1px solid var(--gold-dim);border-radius:4px;padding:3px 8px;color:var(--gold);}
  .score-badge{color:var(--cream);}

  .photo-box{
    position:relative;width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;
    border:1px solid rgba(201,162,75,0.25);margin-bottom:14px;background:var(--navy-2);
  }
  .photo-box img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-fallback{
    display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;color:var(--ink-dim);font-size:0.78rem;text-align:center;padding:0 20px;
  }
  .photo-fallback svg{width:34px;height:34px;opacity:0.5;}
  .photo-credit{position:absolute;bottom:4px;right:8px;font-size:0.6rem;color:rgba(243,238,223,0.55);
    font-family:'JetBrains Mono',monospace;}
  /* The board crops to 16:10, which hides most of the frame. Tapping opens the
     whole photo so the player can read the detail they're guessing from. */
  .photo-box.zoomable{cursor:zoom-in;}
  .zoom-hint{position:absolute;top:6px;right:8px;width:26px;height:26px;border-radius:50%;
    background:rgba(19,29,52,0.7);border:1px solid var(--gold-dim);display:none;
    align-items:center;justify-content:center;pointer-events:none;}
  .photo-box.zoomable .zoom-hint{display:flex;}
  .zoom-hint svg{width:14px;height:14px;stroke:var(--gold);fill:none;stroke-width:2;}
  .lightbox{position:fixed;inset:0;background:rgba(10,14,26,0.94);display:none;
    flex-direction:column;align-items:center;justify-content:center;z-index:30;
    padding:16px;padding-top:max(16px, env(safe-area-inset-top));
    padding-bottom:max(16px, env(safe-area-inset-bottom));}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:8px;
    border:1px solid rgba(201,162,75,0.3);}
  .lightbox-credit{margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:0.68rem;
    color:var(--ink-dim);text-align:center;max-width:640px;}
  .lightbox-close{position:absolute;top:max(10px, env(safe-area-inset-top));right:14px;
    background:transparent;border:1px solid var(--gold-dim);color:var(--gold);border-radius:6px;
    min-width:44px;min-height:44px;font-size:1.1rem;cursor:pointer;}

  .map-wrap{background:var(--navy-2);border:1px solid rgba(201,162,75,0.25);border-radius:12px;padding:14px;margin-bottom:14px;}
  #mapSvg{width:100%;height:auto;display:block;}
  .map-readout{margin-top:8px;font-size:0.82rem;color:var(--ink-dim);text-align:center;}
  .map-readout b{color:var(--cream);font-weight:500;}

  .guess-row{position:relative;margin-bottom:12px;}
  #guessInput{width:100%;background:var(--navy-3);border:1px solid var(--gold-dim);border-radius:8px;
    padding:12px 14px;color:var(--cream);font-family:'Inter',sans-serif;font-size:0.93rem;}
  #guessInput:focus{outline:none;border-color:var(--gold);}
  #guessInput::placeholder{color:var(--ink-dim);}
  .suggestions{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--navy-3);
    border:1px solid var(--gold-dim);border-radius:8px;overflow:hidden;z-index:5;
    max-height:45vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .suggestion{padding:9px 14px;font-size:0.86rem;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05);}
  .suggestion:last-child{border-bottom:none;}
  .suggestion:hover{background:rgba(201,162,75,0.14);}

  .clues{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px;}
  .clue{background:var(--navy-2);border:1px dashed rgba(201,162,75,0.25);border-radius:8px;padding:8px 9px;
    font-size:0.76rem;color:var(--ink-dim);min-height:38px;}
  .clue.full{grid-column:1 / -1;}
  .clue .label{display:block;font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--gold-dim);margin-bottom:2px;}
  .clue.locked{color:rgba(156,166,192,0.35);}
  .clue.unlocked{border-style:solid;color:var(--ink);}
  .clue.unlocked .label{color:var(--gold);}

  .history{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .hist-row{background:var(--navy-2);border-radius:8px;padding:8px 11px;display:flex;align-items:center;gap:8px;font-size:0.8rem;}
  .hist-dot{width:11px;height:11px;border-radius:50%;flex:none;}
  .hist-name{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--cream);}
  .hist-km{font-family:'JetBrains Mono',monospace;font-size:0.73rem;color:var(--ink-dim);}

  .round-result, .final-result{background:var(--navy-2);border:1px solid var(--gold);border-radius:10px;
    padding:16px;text-align:center;margin-bottom:14px;}
  .round-result h2, .final-result h2{font-family:'Playfair Display',serif;color:var(--cream);margin:0 0 6px;font-size:1.2rem;}
  .round-result p, .final-result p{color:var(--ink-dim);font-size:0.83rem;margin:0 0 10px;}
  .tier-badge{display:inline-block;font-size:0.68rem;font-family:'JetBrains Mono',monospace;color:var(--gold);
    border:1px solid var(--gold-dim);border-radius:4px;padding:2px 7px;margin-bottom:8px;}
  .btn{background:var(--gold);color:var(--navy);border:none;border-radius:6px;padding:10px 18px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:0.85rem;cursor:pointer;margin:3px;}
  .btn.secondary{background:transparent;color:var(--gold);border:1px solid var(--gold-dim);}
  .share-grid{font-family:'JetBrains Mono',monospace;font-size:1rem;line-height:1.5;margin-bottom:10px;white-space:pre-line;}

  footer{text-align:center;font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--ink-dim);}

  /* Touch targets. Anything below 16px in an input makes iOS Safari zoom the
     page on focus and never zoom back, so the guess box goes to 16px exactly;
     controls go to the 44px minimum. Desktop keeps its original sizing. */
  @media (pointer: coarse), (max-width: 560px){
    #guessInput{font-size:16px;}
    .lang-btn{padding:12px 20px;min-height:44px;font-size:0.78rem;}
    .suggestion{padding:0 14px;min-height:46px;display:flex;align-items:center;}
    .btn{min-height:44px;padding:12px 20px;}
    .modal-close{min-height:44px;}
  }
  .suggestion:active{background:rgba(201,162,75,0.22);}
  .btn:active{filter:brightness(0.88);}
  .lang-btn:active{background:rgba(201,162,75,0.2);}

  .modal-backdrop{position:fixed;inset:0;background:rgba(10,14,26,0.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:20;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--navy-2);border:1px solid var(--gold);border-radius:12px;padding:22px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;}
  .modal h3{font-family:'Playfair Display',serif;color:var(--cream);margin:0 0 4px;font-size:1.25rem;}
  .modal .sub{color:var(--ink-dim);font-size:0.78rem;margin-bottom:14px;}
  .modal p{font-size:0.87rem;line-height:1.5;margin:0 0 10px;}
  .modal-section{border-top:1px dashed rgba(201,162,75,0.25);padding-top:10px;margin-top:10px;}
  .modal-section .label{font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:var(--gold-dim);}
  .modal-close{display:block;margin:16px auto 0;}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="wordmark">Heritle</div>
    <div class="tagline" id="tagline"></div>
    <div class="lang-slider" role="tablist">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="es">ES</button>
    </div>
  </header>

  <div class="rounds-row" id="roundsRow"></div>

  <div class="meta-row">
    <span class="mode-badge" id="modeBadge"></span>
    <span class="score-badge" id="scoreBadge"></span>
  </div>

  <div class="photo-box" id="photoBox">
    <img id="siteImg" alt="">
    <div class="photo-fallback" id="photoFallback">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-6h6v6"/></svg>
      <span id="fallbackText"></span>
    </div>
    <span class="photo-credit" id="photoCredit"></span>
    <span class="zoom-hint"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v6M8 11h6"/></svg></span>
  </div>

  <div class="map-wrap">
    <svg id="mapSvg" viewBox="0 0 440 220"></svg>
    <div class="map-readout" id="mapReadout"></div>
  </div>

  <div class="guess-row">
    <input type="text" id="guessInput" autocomplete="off">
    <div class="suggestions" id="suggestions" style="display:none;"></div>
  </div>

  <div class="clues" id="clues"></div>
  <div class="history" id="history"></div>
  <div class="round-result" id="roundResult" hidden></div>
  <div class="final-result" id="finalResult" hidden></div>

  <footer id="guessCounter"></footer>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <img id="lightboxImg" alt="">
  <div class="lightbox-credit" id="lightboxCredit"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="sub" id="modalSub"></div>
    <p id="modalDesc"></p>
    <div class="modal-section">
      <span class="label" id="modalVideoLabel"></span>
      <p id="modalVideoText"></p>
    </div>
    <button class="btn secondary modal-close" id="modalClose"></button>
  </div>
</div>

let lang = 'en';
function t(){ return UI[lang]; }

/* ---------- Dataset loading ----------
   data/dataset.json is { meta, countries, entries }. Entries carry categorical
   codes (continent:'EU', category:'cultural') and a country QID rather than
   prose, so the three languages come from the UI table above and can't be left
   half-translated by patchy Wikidata coverage. normaliseEntry() expands that
   back into the same shape as FALLBACK_DATA, so every render path below is
   indifferent to which source it got. */
function normaliseEntry(e, countries){
  const country = countries[e.country] || null;
  const per = (pick) => ({ en:pick('en'), fr:pick('fr'), es:pick('es') });
  return {
    id: e.id, type: e.type, tier: e.tier, lat: e.lat, lng: e.lng,
    year: e.year, approx: e.approx, image: e.image,
    continentCode: e.continent,
    names: e.names,
    aliases: e.aliases || [],
    country:   per(l => country ? country[l] : (UI[l].unknown)),
    continent: per(l => (UI[l].continents[e.continent]) || UI[l].unknown),
    category:  per(l => (UI[l].categories[e.category]) || UI[l].unknown),
    clue:      e.desc ? per(l => e.desc[l] || e.desc.en || '') : null
  };
}

let POOL = FALLBACK_DATA;
let BY_ID = new Map();
let targets = [];
/* The guessing vocabulary. Players guess countries, never site names: with
   ~1,270 inscriptions, most of them places nobody could name unprompted, the
   name was never a fair thing to ask for. The map is the puzzle. */
let COUNTRIES = [];

/* Region is derived here rather than stored, so it needs no pipeline field and
   can never contradict the coordinate it describes. It's the compass sector of
   the entry within its continent -- broad enough to narrow the search without
   naming the answer. */
function regionOf(entry){
  const T = t();
  // The demo set stores continent names rather than codes, so fall back to a
  // reverse lookup off the English name.
  const code = entry.continentCode ||
    Object.keys(UI.en.continents).find(k => UI.en.continents[k] === (entry.continent||{}).en);
  const cont = (UI[lang].continents[code]) || (entry.continent||{})[lang] || UI[lang].unknown;
  const band = CONTINENT_BANDS[code];
  if(!band) return cont;
  const vert = entry.lat >= band.lat[1] ? 'N' : (entry.lat <= band.lat[0] ? 'S' : null);
  const horiz = entry.lng >= band.lng[1] ? 'E' : (entry.lng <= band.lng[0] ? 'W' : null);
  const dirKey = vert || horiz || 'C';
  return T.regionOf(T.regions[dirKey], cont);
}

/* Tercile cut points per continent, so "Northern"/"Eastern" mean something
   relative to that landmass rather than to the globe. */
const CONTINENT_BANDS = {
  EU: { lat:[45, 55],   lng:[0, 25] },
  AS: { lat:[20, 40],   lng:[60, 105] },
  AF: { lat:[-10, 15],  lng:[5, 30] },
  NA: { lat:[20, 45],   lng:[-110, -80] },
  SA: { lat:[-25, -5],  lng:[-70, -50] },
  OC: { lat:[-30, -15], lng:[135, 165] },
  AN: { lat:[-80, -70], lng:[-60, 60] }
};

function buildCountries(table){
  // Only countries with a coordinate can be guessed — every guess is measured
  // from the country's centroid to the target.
  return Object.entries(table)
    .filter(([, c]) => typeof c.lat === 'number' && typeof c.lng === 'number')
    .map(([qid, c]) => ({ id: qid, lat: c.lat, lng: c.lng,
                          names: { en: c.en, fr: c.fr, es: c.es } }));
}

/* ---------- Day / targets (one per tier) ---------- */
const EPOCH = Date.UTC(2024,0,1);
const now = new Date();
const dayIndex = Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - EPOCH) / 86400000);

/* Deterministic per-day pick. A plain dayIndex % pool.length would walk the
   fame-sorted pool in order, so consecutive days would be near-identical in
   obscurity; hashing spreads them while staying reproducible for everyone. */
function pickForDay(pool, tier){
  if(!pool.length) return null;
  let h = Math.imul(dayIndex + 1, 2654435761) ^ Math.imul(tier + 1, 40503);
  h ^= h >>> 15; h = Math.imul(h, 2246822519); h ^= h >>> 13;
  return pool[Math.abs(h) % pool.length];
}

/* Each day's three rounds: which type, and how obscure.
   Two material to one intangible tracks the pools (~1,270 sites to ~850
   elements), so neither runs dry ahead of the other, and the tiers ramp from
   widely recognised to hidden gem across the day. */
const ROUND_PLAN = [
  { type: 'material',   tier: 1 },
  { type: 'immaterial', tier: 2 },
  { type: 'material',   tier: 3 }
];

function computeTargets(){
  BY_ID = new Map(POOL.map(d => [d.id, d]));
  const used = new Set();
  targets = ROUND_PLAN.map((plan, i) => {
    // Narrow to type+tier, then relax rather than leave a round unfillable:
    // type+tier -> type -> tier -> anything.
    const tries = [
      POOL.filter(d => d.type === plan.type && d.tier === plan.tier),
      POOL.filter(d => d.type === plan.type),
      POOL.filter(d => d.tier === plan.tier),
      POOL
    ];
    for(const pool of tries){
      const fresh = pool.filter(d => !used.has(d.id));
      const pick = pickForDay(fresh.length ? fresh : pool, i);
      if(pick){ used.add(pick.id); return pick; }
    }
    return null;
  }).filter(Boolean);
}

async function loadDataset(){
  try{
    const res = await fetch('data/dataset.json', { cache: 'no-cache' });
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    const entries = (data.entries || []).filter(e => e && e.id && typeof e.lat === 'number');
    if(entries.length < 3) throw new Error('too few entries');
    if(data.meta && data.meta.synthetic){
      console.warn('Heritle: this dataset.json is SYNTHETIC test data, not the real pipeline output.');
    }
    POOL = entries.map(e => normaliseEntry(e, data.countries || {}));
    COUNTRIES = buildCountries(data.countries || {});
  }catch(err){
    // file://, missing pipeline output, or malformed JSON — play the demo set.
    console.warn('Heritle: falling back to the built-in demo set —', err.message);
    POOL = FALLBACK_DATA;
    COUNTRIES = [];
  }
  if(!COUNTRIES.length){
    // The demo set carries country names inline and no centroids; approximate
    // each country by the entries that sit in it so the game is still playable.
    const acc = new Map();
    POOL.forEach(d => {
      const key = d.country.en;
      const rec = acc.get(key) || { id:'demo-' + key, names:d.country, lat:0, lng:0, n:0 };
      rec.lat += d.lat; rec.lng += d.lng; rec.n++;
      acc.set(key, rec);
    });
    COUNTRIES = [...acc.values()].map(r => ({ id:r.id, names:r.names,
                                              lat:r.lat / r.n, lng:r.lng / r.n }));
  }
  computeTargets();
}

/* ---------- Geo math ---------- */
function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function bearing(lat1,lng1,lat2,lng2){
  const toRad=x=>x*Math.PI/180;
  const y=Math.sin(toRad(lng2-lng1))*Math.cos(toRad(lat2));
  const x=Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lng2-lng1));
  return (Math.atan2(y,x)*180/Math.PI + 360) % 360;
}

}

  const box = document.getElementById('clues'); box.innerHTML = '';
  keys.forEach((key,i)=>{
    const unlocked = currentGuesses().length > i || roundFinished();
    const div = document.createElement('div');
    div.className = 'clue' + (key==='clue' ? ' full' : '') + (unlocked ? ' unlocked' : ' locked');
    let value = '···';
    if(unlocked){
      if(key==='continent') value = target.continent[lang];
      else if(key==='category') value = target.category[lang];
      else if(key==='year') value = target.year ? `${Math.floor(target.year/10)*10}s` : '—';
      else if(key==='region') value = regionOf(target);
      else if(key==='clue') value = (target.clue && target.clue[lang]) || '—';
    }
    div.innerHTML = `<span class="label">${T.clueLabels[i]}</span>${value}`;
    box.appendChild(div);
  });
}

function renderHistory(){
  const T = t();
  const box = document.getElementById('history'); box.innerHTML = '';
  [...currentGuesses()].reverse().forEach(g=>{
    const entry = COUNTRIES.find(c=>c.id===g.id);
    if(!entry) return;  // stored guess from a previous pool
    const row = document.createElement('div'); row.className = 'hist-row';
    row.innerHTML = `<span class="hist-dot" style="background:${heatColorVar[g.bucket]}"></span>
      <span class="hist-name">${entry.names[lang]}</span><span class="hist-km">${g.km} km</span>`;
    box.appendChild(row);
  });
}

function renderMapForRound(){
  buildMap();
  currentGuesses().forEach((g,i)=>{
    const e = COUNTRIES.find(c=>c.id===g.id);
    if(e) addPin(e.lat, e.lng, g.bucket, i===currentGuesses().length-1);
  });
  if(roundFinished()){
    const b = state.bonusKm[state.round];
    if(b) addPin(b.lat, b.lng, 'mid', false);   // where the player pinned
    addTargetPin(currentTarget().lat, currentTarget().lng);
  }
  document.getElementById('mapSvg').style.cursor =
    (state.bonusOpen && roundFinished()) ? 'crosshair' : '';
  const T = t();
  const readout = document.getElementById('mapReadout');
  if(!currentGuesses().length){ readout.textContent = T.readoutStart; }
  else{ const last = currentGuesses()[currentGuesses().length-1]; readout.innerHTML = T.readout(last.km, dirLabel(last.bearing)); }
}

function totalScore(){ return Math.round(state.roundScore.reduce((a,b)=>a+b,0)); }

function renderRoundResult(){
  const box = document.getElementById('roundResult');
  const T = t(); const target = currentTarget();
  if(!roundFinished()){ box.hidden = true; return; }
  box.hidden = false;
  const solved = state.roundStatus[state.round] === 'solved';
  const grid = currentGuesses().map(g=>heatEmoji[g.bucket]).join(' ');
  const bonus = state.bonusKm[state.round];
  // The site name is the reward, not the puzzle: it is revealed either way,
  // alongside the country that was the actual answer.
  const reveal = `<p>${T.answerWas} <b>${target.country[lang]}</b><br>
                  <span style="color:var(--cream)">${target.names[lang]}</span></p>`;
  let bonusBlock = '';
  if(solved && state.bonusOpen){
    bonusBlock = `<p id="bonusPrompt">${T.bonusPrompt}</p>
                  <button class="btn secondary" id="skipBonusBtn">${T.bonusSkip}</button>`;
  } else if(bonus !== null && bonus !== undefined){
    bonusBlock = `<p>${T.bonusResult(bonus.km, bonus.pts)}</p>`;
  } else if(solved){
    bonusBlock = `<p>${T.bonusNone}</p>`;
  }
  box.innerHTML = `
    <span class="tier-badge">${T.tier[target.tier]}</span>
    <h2>${solved ? T.win : T.lose}</h2>
    <p>${solved ? T.winSub(currentGuesses().length) : ''}</p>
    ${reveal}
    <div class="share-grid">${grid}</div>
    ${bonusBlock}
    ${state.bonusOpen && solved ? '' :
      `<button class="btn" id="nextBtn">${T.nextRound}</button>
       <button class="btn secondary" id="learnBtn">${T.learnMore}</button>`}`;
  if(!(state.bonusOpen && solved)){
    document.getElementById('nextBtn').onclick = ()=>{
      state.round++; state.bonusOpen = false; saveState(); render();
    };
    document.getElementById('learnBtn').onclick = ()=> openInfoModal(target);
  } else {
    document.getElementById('skipBonusBtn').onclick = ()=>{
      state.bonusOpen = false; saveState(); render();
    };
  }
  document.getElementById('guessInput').disabled = true;
  document.getElementById('suggestions').style.display='none';
}

/* ---------- Region bonus ----------
   Naming the country ends the round; this is the precision round. One tap on
   the map, scored by how close the pin lands, worth the remaining 20% of the
   round. Optional — skipping just forfeits it. */
const BONUS_FULL_KM = 50;    // at or under this, full bonus
const BONUS_ZERO_KM = 1500;  // beyond this, nothing

function bonusPoints(km){
  if(km <= BONUS_FULL_KM) return 1;
  if(km >= BONUS_ZERO_KM) return 0;
  return 1 - (km - BONUS_FULL_KM) / (BONUS_ZERO_KM - BONUS_FULL_KM);
}

function unproject(x, y){
  return { lat: 90 - (y / MAP_H) * 180, lng: (x / MAP_W) * 360 - 180 };
}

function handleBonusTap(evt){
  if(!state.bonusOpen || !roundFinished()) return;
  const svg = document.getElementById('mapSvg');
  const rect = svg.getBoundingClientRect();
  const x = ((evt.clientX - rect.left) / rect.width) * MAP_W;
  const y = ((evt.clientY - rect.top) / rect.height) * MAP_H;
  const p = unproject(x, y);
  const target = currentTarget();
  const km = Math.round(haversineKm(p.lat, p.lng, target.lat, target.lng));
  const frac = bonusPoints(km);
  const pts = Math.round(frac * (100/3) * 0.2);
  state.roundScore[state.round] += frac * (100/3) * 0.2;
  state.bonusKm[state.round] = { km, pts, lat: p.lat, lng: p.lng };
  state.bonusOpen = false;
  saveState();
  render();
}
document.getElementById('mapSvg').addEventListener('click', handleBonusTap);

function renderFinal(){
  const T = t();
  document.getElementById('roundsRow').style.display = 'flex';
  document.getElementById('modeBadge').textContent = '';
  document.getElementById('scoreBadge').textContent = '';
  document.getElementById('photoBox').style.display = 'none';
  document.querySelector('.map-wrap').style.display = 'none';
  document.querySelector('.guess-row').style.display = 'none';
  document.getElementById('clues').style.display = 'none';
  document.getElementById('history').style.display = 'none';
  document.getElementById('roundResult').hidden = true;
  document.getElementById('guessCounter').textContent = '';

  const box = document.getElementById('finalResult'); box.hidden = false;
  const lines = targets.map((tg,i)=> state.guesses[i].map(g=>heatEmoji[g.bucket]).join(' ') || '—').join('\n');
  box.innerHTML = `<h2>${T.finalTitle}</h2><p>${T.finalSub(totalScore())}</p>
    <div class="share-grid">${lines}</div>
    <p>${T.playTomorrow}</p>
    <div id="learnLinks"></div>
    <button class="btn" id="shareBtn">Copy result</button>`;
  const linksBox = document.getElementById('learnLinks');
  targets.forEach(tg=>{
    const b = document.createElement('button');
    b.className = 'btn secondary'; b.textContent = tg.names[lang]; b.style.fontSize='0.75rem';
    b.onclick = ()=> openInfoModal(tg);
    linksBox.appendChild(b);
  });
  document.getElementById('shareBtn').onclick = ()=>{
    const text = `Heritle — Day #${dayIndex}\n${lines}\n${totalScore()}/100`;
    navigator.clipboard?.writeText(text);
  };
}

/* ---------- Photo viewer ----------
   The board crops to 16:10; this shows the whole frame so the detail the player
   is guessing from — architecture, vegetation, signage — is actually legible. */
const lightbox = document.getElementById('lightbox');
function openLightbox(){
  const target = currentTarget();
  const img = document.getElementById('siteImg');
  if(!target || !document.getElementById('photoBox').classList.contains('zoomable')) return;
  document.getElementById('lightboxImg').src = img.src;
  document.getElementById('lightboxImg').alt = roundFinished() ? target.names[lang] : '';
  document.getElementById('lightboxCredit').textContent =
    target.image ? [target.image.credit, target.image.license].filter(Boolean).join(' · ') : '';
  lightbox.classList.add('open');
}
function closeLightbox(){ lightbox.classList.remove('open'); }
document.getElementById('photoBox').addEventListener('click', openLightbox);
document.getElementById('lightboxClose').addEventListener('click', e=>{ e.stopPropagation(); closeLightbox(); });
lightbox.addEventListener('click', closeLightbox);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLightbox(); });

/* ---------- Info modal ---------- */
function openInfoModal(entry){
  const T = t();
  document.getElementById('modalTitle').textContent = entry.names[lang];
  document.getElementById('modalSub').textContent =
    [entry.country[lang], entry.category[lang], entry.year].filter(Boolean).join(' · ');
  document.getElementById('modalDesc').textContent = (entry.clue && entry.clue[lang]) || '';
  document.getElementById('modalVideoLabel').textContent = T.videoLabel;
  document.getElementById('modalVideoText').textContent = T.videoText;
  document.getElementById('modalClose').textContent = T.close;
  document.getElementById('modalBackdrop').classList.add('open');
}
document.getElementById('modalClose').addEventListener('click', ()=> document.getElementById('modalBackdrop').classList.remove('open'));
document.getElementById('modalBackdrop').addEventListener('click', e=>{ if(e.target.id==='modalBackdrop') e.currentTarget.classList.remove('open'); });

/* ---------- Guessing ---------- */
function submitGuess(country){
  if(state.round >= 3 || roundFinished()) return;
  const guesses = currentGuesses();
  if(guesses.some(g=>g.id===country.id)) return;
  const target = currentTarget(), answer = targetCountry();
  // Distance runs from the guessed country to the *site*, so the heat keeps
  // pointing at the real place even once you are in the right country.
  const km = Math.round(haversineKm(country.lat, country.lng, target.lat, target.lng));
  const brg = bearing(country.lat, country.lng, target.lat, target.lng);
  const isCorrect = answer ? country.id === answer.id
                           : country.names.en === target.country.en;
  guesses.push({ id: country.id, km, bearing: brg,
                 bucket: isCorrect ? 'correct' : heatBucket(km) });

  if(isCorrect){
    state.roundStatus[state.round] = 'solved';
    // 80% of the round is the country; the pin bonus can earn the last 20%.
    state.roundScore[state.round] = GUESS_FRACTIONS[guesses.length-1] * (100/3) * 0.8;
    state.bonusOpen = true;
  } else if(guesses.length >= 6){
    state.roundStatus[state.round] = 'failed';
    state.roundScore[state.round] = 0;
  }
  saveState();
  document.getElementById('guessInput').value='';
  document.getElementById('suggestions').style.display='none';
  render();
}

/* ---------- Autocomplete ---------- */
const input = document.getElementById('guessInput');
const suggBox = document.getElementById('suggestions');
input.addEventListener('input', ()=>{
  const q = input.value.trim().toLowerCase();
  suggBox.innerHTML = '';
  if(q.length < 2 || roundFinished()){ suggBox.style.display='none'; return; }
  const guessedIds = new Set(currentGuesses().map(g=>g.id));
  const matches = COUNTRIES.filter(c=>{
    if(guessedIds.has(c.id)) return false;
    return [c.names.en, c.names.fr, c.names.es].join(' ').toLowerCase().includes(q);
  }).slice(0,6);
  if(!matches.length){ suggBox.style.display='none'; return; }
  matches.forEach(m=>{
    const div = document.createElement('div'); div.className = 'suggestion'; div.textContent = m.names[lang];
    div.onclick = ()=> submitGuess(m);
    suggBox.appendChild(div);
  });
  suggBox.style.display='block';
});
input.addEventListener('focus', ()=>{
  // The on-screen keyboard shrinks the visual viewport a beat after focus.
  // Centring the guess row keeps the suggestion list above the keyboard rather
  // than under it — on a 360x740 phone the first suggestion was off-screen.
  setTimeout(()=>{
    document.querySelector('.guess-row').scrollIntoView({ block:'center', behavior:'smooth' });
  }, 250);
});
input.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const q = input.value.trim().toLowerCase();
    const guessedIds = new Set(currentGuesses().map(g=>g.id));
    const exact = COUNTRIES.find(c=>!guessedIds.has(c.id) &&
      [c.names.en,c.names.fr,c.names.es].some(n=>n.toLowerCase()===q));
    if(exact) submitGuess(exact);
  }
});
document.addEventListener('click', e=>{ if(!e.target.closest('.guess-row')) suggBox.style.display='none'; });

/* ---------- Language slider ---------- */
document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); lang = btn.dataset.lang; render();
  });
});

/* ---------- Init ---------- */
loadDataset().then(render);
</script>
