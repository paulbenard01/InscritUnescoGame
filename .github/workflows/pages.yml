name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The game shell is a single file with no build step; index.html is just
      # heritle.html under the name Pages serves by default.
      - name: Stage site
        run: |
          mkdir -p _site
          cp heritle.html _site/index.html
          [ -d data ] && cp -r data _site/ || echo "no data/ — the game will use its built-in fallback set"
          # The header loads its mark from assets/. Leaving this out is how the
          # logo was missing from the live site while every check passed: the
          # smoke suite copies assets/ into its own hermetic root, so it proved
          # the page works rather than that the deploy ships what the page asks
          # for.
          [ -d assets ] && cp -r assets _site/ || echo "no assets/ — the header will show the wordmark alone"
          [ -d images ] && cp -r images _site/ || echo "no images/ — photo placeholders will show"
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
