name: Verify live site

# Plays the deployed GitHub Pages URL for real, in a browser, and fails if the
# live site does not behave. Runs here rather than locally because the
# development sandbox cannot reach github.io.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Site URL to play'
        required: false
        default: 'https://paulbenard01.github.io/Heritle/'
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
  # main only. This checks the deployed site, so running it from a feature
  # branch tests main's deployment against the branch's expectations: any
  # branch that adds a check for something not yet deployed fails by
  # construction, which says nothing about either.
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live.yml'
      - 'tests/smoke.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install playwright && playwright install --with-deps chromium

      - name: Wait for the deploy to settle
        run: sleep 25

      - name: Fetch the live URL
        id: fetch
        env:
          URL: ${{ inputs.url || 'https://paulbenard01.github.io/Heritle/' }}
        run: |
          set -euo pipefail
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          code=$(curl -sS -o /tmp/live.html -w '%{http_code}' -L "$URL")
          echo "index: HTTP $code, $(wc -c < /tmp/live.html) bytes"
          test "$code" = "200"
          grep -q 'Heritle' /tmp/live.html || { echo "wordmark missing"; exit 1; }
          # Every file under assets/ that the page asks for has to be on the
          # deployed site. The logo was missing from the live site for exactly
          # this reason -- the staging step did not copy assets/ -- and nothing
          # caught it, because the smoke suite copies assets/ into its own
          # hermetic root. Read out of the live HTML, so a new asset is covered
          # the moment it is referenced rather than when someone remembers.
          refs=$(grep -o 'src="assets/[^"]*"' /tmp/live.html | sed 's/src="//; s/"$//' | sort -u)
          test -n "$refs" || { echo "the page references no assets/ files -- did the header change?"; exit 1; }
          for ref in $refs; do
            rc=$(curl -sS -o /dev/null -w '%{http_code}' -L "${URL%/}/$ref")
            echo "asset $ref: HTTP $rc"
            test "$rc" = "200" || { echo "the page asks for $ref but the deploy does not ship it"; exit 1; }
          done
          dcode=$(curl -sS -o /tmp/live.json -w '%{http_code}' -L "${URL%/}/data/dataset.json")
          echo "dataset: HTTP $dcode, $(wc -c < /tmp/live.json) bytes"
          test "$dcode" = "200"
          lcode=$(curl -sS -o /tmp/land.json -w '%{http_code}' -L "${URL%/}/data/land.json")
          echo "land: HTTP $lcode, $(wc -c < /tmp/land.json) bytes"
          test "$lcode" = "200"
          python - <<'PY'
          import json
          land = json.load(open('/tmp/land.json'))
          assert land.get('width') == 440 and land.get('height') == 220, \
              "map geometry built for a different canvas — coastlines would be misplaced"
          # Per-country rings, not a single path: guessing is done by tapping,
          # so geometry the game cannot attribute to a country is unusable.
          shapes = land.get('shapes') or {}
          verts = sum(len(r) for rs in shapes.values() for r in rs) // 2
          print(f"live map geometry: {len(shapes)} countries, {verts} vertices")
          assert len(shapes) > 150, "map geometry is missing countries"
          assert verts > 20000, "map geometry looks truncated"
          d = json.load(open('/tmp/live.json'))
          e = d['entries']
          print(f"live dataset: {len(e)} entries, {len(d['countries'])} countries")
          assert len(e) > 1000, "dataset looks truncated"
          assert all('lat' in x for x in e[:50]), "entries missing coordinates"
          with_coords = sum(1 for c in d['countries'].values() if 'lat' in c)
          print(f"countries with centroids: {with_coords}")
          assert with_coords > 150, "countries missing centroids — guessing would break"
          PY

      - name: Play the live site
        run: python tests/smoke.py --url "${{ steps.fetch.outputs.url }}" 2>&1 | tee live.log

      - name: Report
        if: always()
        run: |
          echo '### Live site verification' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -60 live.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
