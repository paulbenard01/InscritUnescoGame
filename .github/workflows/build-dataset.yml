name: Build dataset

# The pipeline needs Wikidata + Wikimedia Commons, so it runs here rather than
# on a laptop. This is also the natural home for it long-term: inscriptions are
# added every year, so the dataset wants a periodic refresh.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Cap entries per designation (blank = full run)'
        required: false
        default: ''
      skip_images:
        description: 'Metadata only, no photo downloads'
        type: boolean
        default: false
      commit:
        description: 'Commit data/ (and images/) back to this branch'
        type: boolean
        default: false
  schedule:
    - cron: '0 4 1 * *'   # monthly refresh
  # workflow_dispatch only registers once this file is on the default branch, so
  # editing it on a feature branch also kicks a run — always as a small, safe
  # smoke test (see the arg defaults below), never a full crawl.
  push:
    paths:
      - '.github/workflows/build-dataset.yml'
      - 'build_dataset.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run pipeline
        env:
          UNESCLE_CONTACT: ${{ github.repository_owner }}@users.noreply.github.com
        run: |
          # pipefail matters: the run is piped through tee, so without it a
          # pipeline crash exits 0 and the job reports a green build.
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # Branch smoke configuration. Edit this line to widen a branch run
            # (it shows up in the diff); an incidental push must never start a
            # full crawl by accident.
            ARGS="--limit 40 --skip-images"
          else
            ARGS=""
            if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
            if [ "${{ inputs.skip_images }}" = "true" ]; then ARGS="$ARGS --skip-images"; fi
          fi
          echo "build_dataset.py $ARGS"
          python build_dataset.py $ARGS 2>&1 | tee build.log
          if [ -d images ]; then
            echo "images: $(ls images | wc -l) files, $(du -sh images | cut -f1)" | tee -a build.log
          fi

      - name: Report
        run: |
          echo "### Dataset build" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -40 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f data/dataset.json ]; then
            echo "dataset.json: $(du -h data/dataset.json | cut -f1)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d images ]; then
            echo "images: $(ls images | wc -l) files, $(du -sh images | cut -f1)" >> $GITHUB_STEP_SUMMARY
          fi
          # Spot-check sample for the sanity pass — 15 random entries, both types.
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, random
          try:
              d = json.load(open('data/dataset.json'))
          except Exception as e:
              print('no dataset:', e); raise SystemExit
          e = d['entries']; c = d.get('countries', {})
          random.seed(1)
          print('\n### Spot-check (15 random entries)\n')
          print('| id | type | tier | lat,lng | approx | country | en / fr / es | photo |')
          print('|---|---|---|---|---|---|---|---|')
          for x in random.sample(e, min(15, len(e))):
              cn = c.get(x.get('country'), {}).get('en', '—')
              names = ' / '.join(x['names'][l][:22] for l in ('en','fr','es'))
              print(f"| {x['id'][:28]} | {x['type'][:4]} | {x['tier']} | "
                    f"{x['lat']:.1f},{x['lng']:.1f} | {'Y' if x.get('approx') else ''} | "
                    f"{cn[:14]} | {names} | {'Y' if 'image' in x else ''} |")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dataset
          path: |
            data/
            build.log
          if-no-files-found: warn

      - name: Commit
        if: inputs.commit == true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data images 2>/dev/null || git add -A data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Rebuild dataset from Wikidata + Commons

          Generated by the build-dataset workflow."
            git push origin HEAD:${{ github.ref_name }}
          fi
