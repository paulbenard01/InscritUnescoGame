name: Build map geometry

# Natural Earth has to be downloaded, so this runs here rather than on a
# laptop. The output is small and changes only when the source or the
# simplification does, so it is committed rather than rebuilt on every deploy.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit data/land.json back to this branch'
        type: boolean
        default: true
  push:
    paths:
      - 'tools/build_land.py'
      - '.github/workflows/build-land.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Build
        run: |
          set -euo pipefail
          python tools/build_land.py 2>&1 | tee land.log

      - name: Report
        if: always()
        run: |
          echo '### Map geometry' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat land.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: land
          path: |
            data/land.json
            land.log
          if-no-files-found: warn

      # Default true: unlike the dataset this is cheap, deterministic, and the
      # game fetches it at runtime, so a build that is not committed is a build
      # that did nothing.
      - name: Commit
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.commit }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/land.json          # data/ is gitignored
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Rebuild map geometry from Natural Earth

          Generated by the build-land workflow."
            git push origin HEAD:${{ github.ref_name }}
          fi
